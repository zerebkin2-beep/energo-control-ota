name: Publish ECM HOME 0.3.10 OTA
on:
  push:
    branches: [publish-home-0.3.10-ota]
    paths: ['.github/workflows/publish-home-0.3.10.yml']
permissions:
  contents: write
concurrency:
  group: ecm-home-ota-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish and verify signed home OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash publish/home-0.3.10/publish.sh
