name: Publish signed ECM OTA v2
on:
  push:
    branches: [publish-ota-v2-0.2.9.16]
    paths: [".github/workflows/publish-ota-v2.yml"]
permissions:
  contents: write
concurrency:
  group: tox-ota-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify, publish and recheck both OTA channels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash publish/publish.sh
