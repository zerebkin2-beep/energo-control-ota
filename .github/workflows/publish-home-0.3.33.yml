name: Publish HOME apartment 0.3.33 OTA
on:
  push:
    branches: [ota/publish-home-0.3.33]
    paths:
      - 'ota-staging/firmware-0.3.33.bin'
      - 'ota-staging/manifest-0.3.33.json'
      - '.github/workflows/publish-home-0.3.33.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ota-home-apartment-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install signature verifier
        run: python -m pip install cryptography
      - name: Verify SHA-256, size, OTA channel, and ECDSA P-256 signature
        env:
          OTA_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuSS1dUiaHF+ezsLLXxVjz/DGfqCs
            4Q42Tr1KecUqCi867duWLEWNpVg2spEs1fBGDs3VUidoD/qhnoxSDSjQmg==
            -----END PUBLIC KEY-----
        run: |
          python - <<'PY'
          import json, hashlib, os, pathlib
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          m=json.loads(pathlib.Path("ota-staging/manifest-0.3.33.json").read_text())
          b=pathlib.Path("ota-staging/firmware-0.3.33.bin").read_bytes()
          assert m["board"]=="esp32c3" and m["version"]=="TOX Reliability 0.3.33"
          assert len(b)==m["size"]==1235888
          assert hashlib.sha256(b).hexdigest()==m["sha256"]=="c37c4bc437d21437b840afeb348937d1f5cc4a88b81df45b96402ac85c714105"
          assert m["url"]=="https://github.com/zerebkin2-beep/energo-control-ota/releases/download/ota-apartment-v2/firmware-0.3.33.bin"
          assert b"TOX Reliability 0.3.33" in b and b"ECM Reliability 0.3.33" in b
          payload=f'TOX-OTA-v1\nesp32c3\n{m["version"]}\n{m["size"]}\n{m["sha256"]}\n{m["url"]}\n'.encode()
          key=serialization.load_pem_public_key(os.environ["OTA_PUBLIC_KEY"].encode())
          assert isinstance(key, ec.EllipticCurvePublicKey) and isinstance(key.curve, ec.SECP256R1)
          key.verify(bytes.fromhex(m["signature"]),payload,ec.ECDSA(hashes.SHA256()))
          print("HOME 0.3.33 signature, firmware hash and target passed")
          PY
      - name: Refuse to overwrite unrelated OTA version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/current-release
          gh release download ota-apartment-v2 -p manifest.json -D /tmp/current-release --repo zerebkin2-beep/energo-control-ota
          python - <<'PY'
          import json
          with open("/tmp/current-release/manifest.json") as f: m=json.load(f)
          assert m["board"]=="esp32c3"
          assert m["version"] in ("TOX Reliability 0.3.32","TOX Reliability 0.3.33"), "Unexpected live OTA version. Manual review required."
          print("Current apartment version:",m["version"])
          PY
      - name: Upload firmware first, without activating update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ota-apartment-v2 ota-staging/firmware-0.3.33.bin --repo zerebkin2-beep/energo-control-ota --clobber
          gh release upload ota-apartment-v2 ota-staging/manifest-0.3.33.json --repo zerebkin2-beep/energo-control-ota --clobber
      - name: Publish last — replace OTA default manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/activate-ota
          cp ota-staging/manifest-0.3.33.json /tmp/activate-ota/manifest.json
          gh release upload ota-apartment-v2 /tmp/activate-ota/manifest.json --repo zerebkin2-beep/energo-control-ota --clobber
      - name: Update HOME release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit ota-apartment-v2 --repo zerebkin2-beep/energo-control-ota --title 'ECM Reliability 0.3.33 — квартира (OTA v2)'
      - name: Verify release artifacts after publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ota-apartment-v2 --repo zerebkin2-beep/energo-control-ota --json assets --jq '[.assets[].name] | index("firmware-0.3.33.bin") != null and index("manifest.json") != null' | grep -qx 'true'
